# nginx.vps.conf — Production VPS (Ubuntu 22.04)
# Domain  : acm365hub.poweryoursaas.com
# API     : http://127.0.0.1:5001  (systemd service expatriate365-api)
# SSL     : Let's Encrypt via certbot
#
# Usage (on VPS):
#   sudo cp nginx.vps.conf /etc/nginx/sites-available/expatriate365
#   sudo ln -s /etc/nginx/sites-available/expatriate365 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS + allow certbot ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name acm365hub.poweryoursaas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name acm365hub.poweryoursaas.com;

    # SSL — managed by certbot (run: certbot --nginx -d acm365hub.poweryoursaas.com)
    ssl_certificate     /etc/letsencrypt/live/acm365hub.poweryoursaas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acm365hub.poweryoursaas.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    client_max_body_size 20M;

    # Angular SPA root
    root  /var/www/expatriate365/frontend;
    index index.html;

    # API reverse proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR WebSocket hubs
    location /hubs/ {
        proxy_pass             http://127.0.0.1:5001;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }

    # Scalar API docs
    location /scalar/ {
        proxy_pass http://127.0.0.1:5001;
    }

    # Static uploads — served directly from API working directory
    location ^~ /downloads/avatars/ {
        alias   /var/www/expatriate365/api/downloads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/branding/ {
        alias   /var/www/expatriate365/api/downloads/branding/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/attachments/ {
        alias   /var/www/expatriate365/api/downloads/attachments/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/docs/ {
        alias   /var/www/expatriate365/api/downloads/docs/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Angular SPA — long-lived cache on hashed assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifests — no cache
    location ~* (manifest\.webmanifest|ngsw\.json|ngsw-worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
