# nginx.local.conf — Local development (WSL2 / Linux local)
# API backend : http://127.0.0.1:5001
# Angular dev server : http://127.0.0.1:4200
# Static downloads served directly from the local repo path

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # API reverse proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR WebSocket hubs
    location /hubs/ {
        proxy_pass             http://127.0.0.1:5001;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }

    # Scalar API docs (dev only)
    location /scalar/ {
        proxy_pass http://127.0.0.1:5001;
    }

    # Static uploads — served directly from local source tree
    # Adjust the path below to match your local checkout location
    location ^~ /downloads/avatars/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/branding/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/branding/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/attachments/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/attachments/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/docs/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/docs/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Angular dev server (with HMR websocket)
    location / {
        proxy_pass             http://127.0.0.1:4200;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }
}
