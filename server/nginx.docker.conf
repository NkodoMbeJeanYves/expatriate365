# nginx.docker.conf — Frontend container (used by docker-compose)
# Serves the Angular build and proxies /api/ + /hubs/ to the api container.
# Downloads are served from a shared Docker volume mounted at /downloads.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root  /usr/share/nginx/html;
    index index.html;

    # API reverse proxy → api container (service name in docker-compose)
    location /api/ {
        proxy_pass         http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR WebSocket hubs
    location /hubs/ {
        proxy_pass             http://api:5001;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     86400s;
    }

    # Scalar API docs
    location /scalar/ {
        proxy_pass http://api:5001;
    }

    # Static uploads — shared volume mounted at /downloads in both containers
    location ^~ /downloads/avatars/ {
        alias   /downloads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/branding/ {
        alias   /downloads/branding/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/attachments/ {
        alias   /downloads/attachments/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /downloads/docs/ {
        alias   /downloads/docs/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Long-lived cache on hashed assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifests — no cache
    location ~* (manifest\.webmanifest|ngsw\.json|ngsw-worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
