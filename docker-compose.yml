# docker-compose.yml — expatriate365 full-stack deployment
#
# Services:
#   db       — MySQL 8.0
#   api      — ASP.NET Core 10 backend (built from server/)
#   frontend — nginx serving the Angular build + reverse-proxy to api
#
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. Build the Angular app:  cd client && npm run build
#   3. docker compose up -d --build
#   4. docker compose logs -f api   (watch migrations + startup)
#
# Volumes:
#   db_data    — MySQL data (persistent)
#   downloads  — shared upload directory between api and frontend

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-expatriate365}
      MYSQL_USER:          ${MYSQL_USER:-expatriate365_user}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── ASP.NET Core API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT:       Production
      ASPNETCORE_URLS:              http://0.0.0.0:5001
      ConnectionStrings__MySql:     "Server=db;Port=3306;Database=${MYSQL_DATABASE:-expatriate365};User=${MYSQL_USER:-expatriate365_user};Password=${MYSQL_PASSWORD};"
      Jwt__Issuer:                  ${JWT_ISSUER:-Expatriate365}
      Jwt__Audience:                ${JWT_AUDIENCE:-Expatriate365}
      Jwt__SecretKey:               ${JWT_SECRET_KEY}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryDays:  ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      FileStorage__UrlPrefix:       ${APP_URL:-http://localhost}
      Cors__AllowedOrigins:         ${APP_URL:-http://localhost}
      Smtp__Enabled:                ${SMTP_ENABLED:-false}
      Smtp__Host:                   ${SMTP_HOST:-}
      Smtp__Port:                   ${SMTP_PORT:-587}
      Smtp__Username:               ${SMTP_USERNAME:-}
      Smtp__Password:               ${SMTP_PASSWORD:-}
      Smtp__FromEmail:              ${SMTP_FROM_EMAIL:-}
      Smtp__FromName:               ${SMTP_FROM_NAME:-Expatriate365}
    volumes:
      - downloads:/app/downloads
    expose:
      - "5001"

  # ── nginx + Angular SPA ────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Angular build output (run: cd client && npm run build before compose up)
      - ./client/dist/client/browser:/usr/share/nginx/html:ro
      # nginx config tailored for the Docker network
      - ./server/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared uploads volume (read-only in nginx)
      - downloads:/downloads:ro

volumes:
  db_data:
  downloads:
