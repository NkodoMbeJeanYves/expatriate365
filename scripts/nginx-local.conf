server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # API (.NET tournant sur la machine hôte)
    location /api/ {
        proxy_pass http://host.containers.internal:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fichiers statiques
    location /downloads/avatars/ {
        alias /srv/downloads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /downloads/branding/ {
        alias /srv/downloads/branding/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /downloads/attachments/ {
        alias /srv/downloads/attachments/;
        add_header X-Content-Type-Options nosniff;
    }
    location /downloads/docs/ {
        alias /srv/downloads/docs/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
    }

    # Frontend Angular (dist)
    location / {
        root /srv/frontend;
        try_files $uri $uri/ /index.html;
    }
}