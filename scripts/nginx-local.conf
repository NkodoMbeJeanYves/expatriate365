server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # API (.NET tournant sur la machine hôte)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SignalR / WebSockets
    location /hubs/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Fichiers statiques
    location /downloads/avatars/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /downloads/branding/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/branding/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /downloads/attachments/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/attachments/;
        add_header X-Content-Type-Options nosniff;
    }
    location /downloads/docs/ {
        alias /home/nkodo/dev/expatriate365/server/downloads/docs/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
    }

    location /scalar/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    # Frontend Angular (dist)
    location / {
        proxy_pass http://127.0.0.1:4200;
        try_files $uri $uri/ /index.html;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}