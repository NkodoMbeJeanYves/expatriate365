# =============================================================================
# nginx-expatriate365.conf
# Configuration nginx pour le projet expatriate365
#
# Déploiement sur le VPS :
#   scp scripts/nginx-expatriate365.conf root@acm365hub.poweryoursaas.com:/etc/nginx/sites-available/expatriate365
#   ssh root@acm365hub.poweryoursaas.com "nginx -t && systemctl reload nginx"
#
# Test local avec Podman :
#   podman run -d --name nginx-expatriate \
#     -p 8080:80 \
#     -v "$PWD/scripts/nginx-expatriate365.conf:/etc/nginx/conf.d/default.conf:ro" \
#     -v "$PWD/server/downloads:/srv/downloads:ro" \
#     nginx:alpine
#   (remplacer les alias /var/www/... par /srv/... pour le test local)
# =============================================================================

# ─── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name acm365hub.poweryoursaas.com www.acm365hub.poweryoursaas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name acm365hub.poweryoursaas.com www.acm365hub.poweryoursaas.com;

    ssl_certificate     /etc/letsencrypt/live/acm365hub.poweryoursaas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acm365hub.poweryoursaas.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend Angular ──────────────────────────────────────────────────────
    root  /var/www/expatriate365/frontend;
    index index.html;

    client_max_body_size 20M;

    # Assets statiques Angular — cache long terme (hash dans le nom de fichier)
    location ~* ^/(assets|static)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers PWA — jamais mis en cache (doivent toujours être frais)
    location ~* (manifest\.webmanifest|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        expires 0;
        add_header Cache-Control "no-store, no-cache";
    }

    # ── API ASP.NET Core ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # ── SignalR / WebSockets ──────────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Fichiers uploadés ─────────────────────────────────────────────────────
    # Propriétaire : expatriate365:www-data | chmod 750 + setgid sur les dossiers
    location ^~ /downloads/avatars/ {
        alias /var/www/expatriate365/api/downloads/avatars/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /downloads/branding/ {
        alias /var/www/expatriate365/api/downloads/branding/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /downloads/attachments/ {
        alias /var/www/expatriate365/api/downloads/attachments/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location ^~ /downloads/docs/ {
        alias /var/www/expatriate365/api/downloads/docs/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
    }

    # ── Documentation API (Scalar) ────────────────────────────────────────────
    location /scalar/ {
        proxy_pass       http://127.0.0.1:5001;
        proxy_set_header Host $host;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
